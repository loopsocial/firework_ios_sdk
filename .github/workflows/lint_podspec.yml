name: Lint Podspec

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v2
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
      - name: Install CocoaPods
        run: gem install cocoapods
      - name: Lint Podspec
        env:
          POD_SOURCES: https://github.com/loopsocial/firework_ios_specs.git,https://cdn.cocoapods.org/
        run: |
          pod spec lint FireworkVideo.podspec --sources="$POD_SOURCES" --verbose
          if [ -f FireworkVideo-Static.podspec ]; then
            pod spec lint FireworkVideo-Static.podspec --sources="$POD_SOURCES" --verbose
          else
            echo "FireworkVideo-Static.podspec does not exist. Skipping."
          fi
